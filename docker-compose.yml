name: game-bank

services:
  app:
    build: .
    environment:
      MONGODB_URI: mongodb://mongo:27017/game_bank
      MONGODB_DB: game_bank
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: admin123
      NODE_ENV: production
    ports:
      - "3000:3000"
    depends_on:
      - mongo

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
